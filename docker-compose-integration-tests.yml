version: '3.8'

networks:
  dailymotion-network:
    external: false
    name: dailymotion-network

services:
  integration-tests:
    build:
      context: src
      dockerfile: users/Dockerfile-test
      args:
          - DOCKER_IMAGE=dailymotion-users:latest
    image: dailymotion-postgres-integration-tests:latest
    environment:
      POSTGRES_USER: pgs_user
      POSTGRES_PASSWORD: pgs_password
      POSTGRES_DB: dailymotion_users
      POSTGRES_HOST: dailymotion_db
      POSTGRES_PORT: 5432
      REDIS_CONNECTION_STRING: "redis://@redis:6379/1"
      VERSION: 1.0
      APPLICATION_ENVIRONMENT: test
      APPLICATION_NAME: "Dailymotion User Integration Test"
    command: ["tox", "-e", "users_integration"]
    depends_on:
      dailymotion_db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - dailymotion-network

  dailymotion_db:
    container_name: dailymotion_db
    image: postgres:15
    environment:
      POSTGRES_USER: pgs_user
      POSTGRES_PASSWORD: pgs_password
      POSTGRES_DB: dailymotion_users
    ports:
      - "5432:5432"
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready" ]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    volumes:
      - ./src/users/init-db.sh:/docker-entrypoint-initdb.d/init.sh
    networks:
      - dailymotion-network

  redis:
    image: redis:8.4.0
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    ports:
      - 6379:6379
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
    restart: no
    networks:
      - dailymotion-network
