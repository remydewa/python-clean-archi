[tool.poetry]
name = "users"
version = "0.1.0"
description = "Users Api for dailymotion"
authors = ["Remy DEWAILLY"]
readme = "README.md"
packages = [{include = "app"}]


[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.127.1"
uvicorn = "^0.40.0"
prometheus-fastapi-instrumentator = "^7.1.0"
psycopg-pool = "^3.3.0"
psycopg = "^3.3.2"
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
python-json-logger = "^4.0.0"
redis = "^7.1.0"
certifi = "^2025.11.12"
httpx = "0.27.2"

[tool.poetry.group.test]
optional = true

[tool.poetry.group.test.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
asgi-lifespan = "^2.1.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
